name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Project sites live at /<repo>/, a <user>.github.io repo lives at /.
      - name: Work out the site base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "VITE_BASE=/" >> "$GITHUB_ENV" ;;
            *)           echo "VITE_BASE=/$REPO/" >> "$GITHUB_ENV" ;;
          esac

      - name: Build static site
        run: npm run build
        env:
          # Optional: repo Settings > Secrets and variables > Actions > Variables
          VITE_FORMSPREE_ENDPOINT: ${{ vars.FORMSPREE_ENDPOINT }}

      # GitHub Pages has no server-side routing: serving the SPA as 404.html
      # makes direct links like /projects and page refreshes work.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
